<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheet Music Annotator Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f5; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
        
        .panel { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 10px; width: 100%; max-width: 900px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; box-sizing: border-box;}
        .section { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        button, .btn { padding: 10px 16px; border: none; border-radius: 6px; background: #3b82f6; color: white; cursor: pointer; font-size: 16px; font-weight: 500; transition: 0.2s; }
        button:active, .btn:active { transform: scale(0.95); }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        
        input[type="text"] { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; width: 150px; }
        
        /* Music Symbols */
        .symbol-btn { background: #e4e4e7; color: #18181b; font-family: Georgia, serif; font-size: 18px; font-style: italic; font-weight: bold; min-width: 45px; }
        .shape-btn { background: #fde047; color: #854d0e; font-weight: bold; font-size: 18px; }
        
        #workspace { position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border-radius: 4px; overflow: hidden; background: white; margin-bottom: 50px; max-width: 100%; overflow-x: auto;}
        #pdf-canvas { display: block; max-width: 100%; height: auto; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Draggable Items */
        .draggable-item { position: absolute; pointer-events: auto; user-select: none; transform: translate(-50%, -50%); border: 2px dashed transparent; padding: 5px; cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center;}
        .draggable-item.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); z-index: 100; }
        
        .type-text { font-family: Georgia, serif; font-weight: bold; font-style: italic; color: #b91c1c; white-space: nowrap; }
        
        /* Shapes */
        .type-shape { width: 100px; height: 20px; }
        svg { width: 100%; height: 100%; overflow: visible; }
        path, line { stroke: #b91c1c; stroke-width: 2; fill: none; }
        
        #edit-controls { display: none; background: #bfdbfe; padding: 5px 10px; border-radius: 6px; }
        #edit-controls.active { display: flex; }
    </style>
</head>
<body>

    <div class="panel">
        <div class="section">
            <input type="file" id="upload" accept="application/pdf" style="display: none;">
            <label for="upload" class="btn">📂 Open PDF</label>
            <button class="btn btn-success" onclick="exportPDF()">💾 Save & Export</button>
        </div>
        <div class="section" id="pagination" style="display: none;">
            <button onclick="changePage(-1)">◀</button>
            <span id="page-info" style="font-weight: bold;">Page 1 / 1</span>
            <button onclick="changePage(1)">▶</button>
        </div>
    </div>

    <div class="panel">
        <div class="section">
            <span style="font-size: 14px; font-weight: bold;">Text:</span>
            <input type="text" id="customText" placeholder="e.g. legato">
            <button onclick="addCustomText()">Add Text</button>
            <button class="symbol-btn" onclick="addItem('text', 'p')">p</button>
            <button class="symbol-btn" onclick="addItem('text', 'f')">f</button>
            <button class="symbol-btn" onclick="addItem('text', 'rit.')">rit.</button>
        </div>
        
        <div class="section">
            <span style="font-size: 14px; font-weight: bold;">Shapes:</span>
            <button class="shape-btn" onclick="addItem('cresc', '')">&lt;</button>
            <button class="shape-btn" onclick="addItem('dim', '')">&gt;</button>
            <button class="shape-btn" onclick="addItem('bracket', '')">┌─┐</button>
        </div>
        
        <div class="section" id="edit-controls">
            <span style="font-size: 14px; font-weight: bold;">Edit:</span>
            <button class="symbol-btn edit-text-only" onclick="resizeItem('size', -4)">A-</button>
            <button class="symbol-btn edit-text-only" onclick="resizeItem('size', 4)">A+</button>
            <button class="shape-btn edit-shape-only" onclick="resizeItem('width', -20)">↔-</button>
            <button class="shape-btn edit-shape-only" onclick="resizeItem('width', 20)">↔+</button>
            
            <button class="btn btn-danger" onclick="deleteSelected()">🗑️</button>
        </div>
    </div>

    <div id="workspace">
        <canvas id="pdf-canvas"></canvas>
        <div id="overlay"></div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let originalPdfBytes = null;
        let currentPageNum = 1;
        let scale = 1.5;
        let annotations = []; // { id, pageNum, type, text, x, y, size, width }
        let selectedId = null;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const editControls = document.getElementById('edit-controls');

        document.getElementById('upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalPdfBytes = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
            document.getElementById('pagination').style.display = 'flex';
            currentPageNum = 1; annotations = [];
            renderPage(currentPageNum);
        });

        async function renderPage(pageNum) {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(pageNum);
            const viewport = page.getViewport({ scale: scale });
            canvas.width = viewport.width; canvas.height = viewport.height;
            workspace.style.width = viewport.width + 'px';
            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            document.getElementById('page-info').innerText = `Page ${pageNum} / ${pdfDoc.numPages}`;
            rebuildOverlay();
        }

        function changePage(offset) {
            if (!pdfDoc) return;
            let newPage = currentPageNum + offset;
            if (newPage >= 1 && newPage <= pdfDoc.numPages) {
                currentPageNum = newPage; selectedId = null;
                updateEditControls(); renderPage(currentPageNum);
            }
        }

        function addCustomText() {
            const text = document.getElementById('customText').value;
            if (text.trim() !== '') {
                addItem('text', text);
                document.getElementById('customText').value = ''; // Clear input
            }
        }

        function addItem(type, text) {
            if (!pdfDoc) return alert("Open a PDF first!");
            const newItem = {
                id: Date.now().toString(),
                pageNum: currentPageNum,
                type: type,
                text: text,
                x: canvas.width / 2,
                y: canvas.height / 3,
                size: 24, // for text
                width: 100 // for shapes
            };
            annotations.push(newItem);
            selectItem(newItem.id);
            rebuildOverlay();
        }

        function rebuildOverlay() {
            overlay.innerHTML = '';
            const pageItems = annotations.filter(a => a.pageNum === currentPageNum);
            
            pageItems.forEach(item => {
                const el = document.createElement('div');
                el.className = 'draggable-item';
                if (item.id === selectedId) el.classList.add('selected');
                el.style.left = `${item.x}px`; el.style.top = `${item.y}px`;
                
                if (item.type === 'text') {
                    el.classList.add('type-text');
                    el.innerText = item.text;
                    el.style.fontSize = `${item.size}px`;
                } else {
                    el.classList.add('type-shape');
                    el.style.width = `${item.width}px`;
                    // Generate SVGs for shapes
                    let svgInner = '';
                    if (item.type === 'cresc') {
                        svgInner = `<line x1="0" y1="50%" x2="100%" y2="0%" /><line x1="0" y1="50%" x2="100%" y2="100%" />`;
                    } else if (item.type === 'dim') {
                        svgInner = `<line x1="0" y1="0%" x2="100%" y2="50%" /><line x1="0" y1="100%" x2="100%" y2="50%" />`;
                    } else if (item.type === 'bracket') {
                        svgInner = `<polyline points="0,20 0,0 100%,0 100%,20" />`;
                    }
                    el.innerHTML = `<svg preserveAspectRatio="none">${svgInner}</svg>`;
                }

                // Dragging logic
                let isDragging = false;
                el.addEventListener('pointerdown', (e) => {
                    e.preventDefault(); isDragging = true;
                    el.setPointerCapture(e.pointerId);
                    selectItem(item.id);
                });
                el.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    item.x += e.movementX; item.y += e.movementY;
                    el.style.left = `${item.x}px`; el.style.top = `${item.y}px`;
                });
                el.addEventListener('pointerup', (e) => {
                    isDragging = false; el.releasePointerCapture(e.pointerId);
                });
                overlay.appendChild(el);
            });
        }

        function selectItem(id) {
            selectedId = id;
            rebuildOverlay(); updateEditControls();
        }

        function updateEditControls() {
            if (!selectedId) {
                editControls.classList.remove('active');
                return;
            }
            editControls.classList.add('active');
            const item = annotations.find(a => a.id === selectedId);
            
            // Show/Hide specific buttons based on type
            const textBtns = document.querySelectorAll('.edit-text-only');
            const shapeBtns = document.querySelectorAll('.edit-shape-only');
            
            if (item.type === 'text') {
                textBtns.forEach(b => b.style.display = 'inline-block');
                shapeBtns.forEach(b => b.style.display = 'none');
            } else {
                textBtns.forEach(b => b.style.display = 'none');
                shapeBtns.forEach(b => b.style.display = 'inline-block');
            }
        }

        function resizeItem(property, amount) {
            if (!selectedId) return;
            const item = annotations.find(a => a.id === selectedId);
            if (item) {
                item[property] = Math.max(10, item[property] + amount); // Min size/width is 10
                rebuildOverlay();
            }
        }

        function deleteSelected() {
            if (!selectedId) return;
            annotations = annotations.filter(a => a.id !== selectedId);
            selectedId = null; updateEditControls(); rebuildOverlay();
        }

        canvas.addEventListener('pointerdown', () => {
            selectedId = null; rebuildOverlay(); updateEditControls();
        });

        // Export PDF with native shapes
        async function exportPDF() {
            if (!originalPdfBytes) return alert("No PDF loaded!");
            const { PDFDocument, rgb } = PDFLib;
            const pdfDocLib = await PDFDocument.load(originalPdfBytes);
            const pages = pdfDocLib.getPages();

            for (const item of annotations) {
                const pageIndex = item.pageNum - 1;
                if (pageIndex >= pages.length) continue;
                const page = pages[pageIndex];
                
                const pdfjsPage = await pdfDoc.getPage(item.pageNum);
                const viewport = pdfjsPage.getViewport({ scale: scale });
                
                const pdfX = (item.x / viewport.width) * page.getWidth();
                const pdfY = page.getHeight() - ((item.y / viewport.height) * page.getHeight());

                if (item.type === 'text') {
                    page.drawText(item.text, {
                        x: pdfX, y: pdfY, size: item.size / scale, color: rgb(0,0,0)
                    });
                } else {
                    // Export Shapes natively drawing lines on the PDF
                    const w = item.width / scale;
                    const h = 20 / scale; // Default shape height
                    const black = rgb(0,0,0);
                    const thick = 1.5;

                    // Note: pdfX/pdfY represent the center of the shape
                    if (item.type === 'cresc') {
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY}, end: {x: pdfX + w/2, y: pdfY + h/2}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY}, end: {x: pdfX + w/2, y: pdfY - h/2}, thickness: thick, color: black });
                    } else if (item.type === 'dim') {
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY + h/2}, end: {x: pdfX + w/2, y: pdfY}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY - h/2}, end: {x: pdfX + w/2, y: pdfY}, thickness: thick, color: black });
                    } else if (item.type === 'bracket') {
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY + h/2}, end: {x: pdfX + w/2, y: pdfY + h/2}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY + h/2}, end: {x: pdfX - w/2, y: pdfY}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX + w/2, y: pdfY + h/2}, end: {x: pdfX + w/2, y: pdfY}, thickness: thick, color: black });
                    }
                }
            }

            const pdfBytes = await pdfDocLib.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = "Annotated_Score_Pro.pdf";
            link.click();
        }
    </script>
</body>
</html>
