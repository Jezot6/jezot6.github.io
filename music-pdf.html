<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sheet Music Annotator Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        /* Base App Setup - Native App Feel */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; margin: 0; padding: 0; height: 100vh; overflow: hidden; display: flex; flex-direction: column; overscroll-behavior-y: none;}
        
        #app-container { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* Panel / Toolbar */
        .panel { background: white; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 12px; z-index: 10; flex-shrink: 0; max-height: 45vh; overflow-y: auto; }
        
        .top-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .control-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        button, .btn { padding: 8px 14px; border: none; border-radius: 6px; background: #3b82f6; color: white; cursor: pointer; font-size: 15px; font-weight: 500; transition: 0.1s; touch-action: manipulation; }
        button:active, .btn:active { transform: scale(0.95); }
        .btn-success { background: #10b981; }
        .btn-danger { background: #ef4444; }
        .btn-warning { background: #f59e0b; color: #fff; }
        .btn-toggle { background: #64748b; }
        .btn-toggle.active { background: #f59e0b; color: #000; font-weight: bold; box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3); }
        
        select.dropdown-tool { padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; font-size: 15px; font-weight: bold; color: #0f172a; cursor: pointer; outline: none; flex-grow: 1; }
        select.dropdown-tool:focus { border-color: #3b82f6; }
        
        input[type="text"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; flex-grow: 1; min-width: 80px;}
        
        /* Edit Controls */
        .symbol-btn { background: #e2e8f0; color: #0f172a; font-family: Georgia, serif; font-size: 16px; font-style: italic; font-weight: bold; min-width: 35px; }
        .shape-btn { background: #fef08a; color: #854d0e; font-weight: bold; font-size: 15px; min-width: 35px; padding: 6px 10px; }
        .nudge-btn { background: #bae6fd; color: #0369a1; font-size: 16px; font-weight: bold; min-width: 35px; padding: 8px; }
        .fast-btn { background: #e0e7ff; color: #4338ca; font-size: 14px; font-weight: bold; padding: 8px 10px; border: 2px solid transparent; }
        .fast-btn.active { background: #fef08a; color: #854d0e; border-color: #eab308; }
        
        #edit-controls { display: none; background: #bfdbfe; padding: 10px; border-radius: 6px; border: 1px solid #93c5fd; width: 100%; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px; box-sizing: border-box;}
        #edit-controls.active { display: flex; }
        .edit-divider { width: 2px; height: 30px; background: #60a5fa; margin: 0 4px; }
        
        /* Workspace Wrapper */
        #workspace-container { flex-grow: 1; overflow: auto; display: flex; justify-content: center; align-items: flex-start; padding: 20px; background: #475569; touch-action: pan-x pan-y;}
        .touch-locked { touch-action: none !important; }
        
        /* Canvas Context */
        #workspace { position: relative; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #pdf-canvas { display: block; max-width: 100%; height: auto; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .draggable-item { 
            position: absolute; pointer-events: auto; user-select: none; 
            transform: translate(-50%, -50%); border: 2px dashed transparent; 
            cursor: grab; display: flex; align-items: center; justify-content: center;
            padding: 15px; margin: -15px; touch-action: none; -webkit-user-select: none;
        }
        .draggable-item:active { cursor: grabbing; }
        .draggable-item.selected { border-color: #3b82f6; background: rgba(59, 130, 246, 0.15); z-index: 100; box-shadow: 0 0 0 2px rgba(255,255,255,0.5) inset;}
        
        .type-text { font-family: Georgia, serif; font-weight: bold; font-style: italic; color: #b91c1c; white-space: nowrap; line-height: 1;}
        
        svg { width: 100%; height: 100%; overflow: visible; pointer-events: none;}
        path, line, polyline { stroke: #b91c1c; stroke-width: 2; fill: none; }
        
        .shortcut-hint { font-size: 11px; color: #64748b; font-weight: normal; margin-left: auto; padding-right: 5px; text-align: right; line-height: 1.3; }

        @media (orientation: landscape) and (min-width: 700px) {
            #app-container { flex-direction: row-reverse; } 
            .panel { width: 340px; height: 100vh; max-height: 100vh; box-shadow: -4px 0 15px rgba(0,0,0,0.3); border-left: 1px solid #cbd5e1; }
            .top-row { flex-direction: column; align-items: stretch; }
            .control-group { flex-direction: column; align-items: stretch; }
            #toolbar { flex-direction: column; align-items: stretch; }
            #pagination { justify-content: space-between; background: #f1f5f9; padding: 5px; border-radius: 6px; }
            .shortcut-hint { display: none; }
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="panel">
            <div class="top-row">
                <div class="control-group">
                    <input type="file" id="upload" accept="application/pdf" style="display: none;">
                    <label for="upload" class="btn" style="text-align: center;">📂 Open PDF</label>
                    <div style="display: flex; gap: 6px;">
                        <button class="btn btn-success" style="flex: 1;" onclick="exportPDF()">💾 Export</button>
                        <button class="btn btn-warning" onclick="discardAll()" title="Delete all current markings">🧹 Marks</button>
                        <button class="btn btn-danger" onclick="clearEntireSession()" title="Completely reset the app">🧨 Reset</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <span class="shortcut-hint hidden-mobile">
                        <b>P/F</b> = p/f <i>(Shift=pp/ff)</i> | <b>M</b> = mp <i>(Shift=mf)</i><br>
                        <b>6/8/4/2</b> = ^ / . / > / -<br>
                        <b>S/R/A/T</b> = sfz / rit / accel / a tempo<br>
                        <b>L</b> = Slur Top <i>(Shift=Slur Bottom)</i>
                    </span>
                    <button id="touchToggleBtn" class="btn btn-toggle" onclick="toggleTouchMode()">👆 Touch Mode: OFF</button>
                    
                    <div id="pagination" style="display: none; gap: 5px; align-items: center;">
                        <button onclick="changePage(-1)">◀</button>
                        <span id="page-info" style="font-weight: bold; font-size: 14px;">1 / 1</span>
                        <button onclick="changePage(1)">▶</button>
                    </div>
                </div>
            </div>

            <div id="statusMessage" style="color: #10b981; font-weight: bold; font-size: 14px; display: none; text-align: center;"></div>
            
            <div id="toolbar" class="control-group" style="display: none; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px solid #e2e8f0;">
                
                <select class="dropdown-tool" onchange="handleToolSelect(this)">
                    <option value="" disabled selected>🎹 Dynamics</option>
                    <option value="pp">pp [Shift+P]</option>
                    <option value="p">p [P]</option>
                    <option value="mp">mp [M]</option>
                    <option value="mf">mf [Shift+M]</option>
                    <option value="f">f [F]</option>
                    <option value="ff">ff [Shift+F]</option>
                    <option value="sfz">sfz [S]</option>
                </select>

                <select class="dropdown-tool" onchange="handleToolSelect(this)" style="font-family: Georgia, serif; font-style: italic;">
                    <option value="" disabled selected style="font-family: sans-serif; font-style: normal;">🎵 Articulations</option>
                    <option value=">">&gt; [4]</option>
                    <option value="^">^ [6]</option>
                    <option value=".">. [8]</option>
                    <option value="-">- [2]</option>
                </select>

                <select class="dropdown-tool" onchange="handleToolSelect(this)">
                    <option value="" disabled selected>📐 Shapes</option>
                    <option value="cresc">&lt; Cresc [C]</option>
                    <option value="dim">&gt; Dim [D]</option>
                    <option value="bracket">┌─┐ Bracket [B]</option>
                    <option value="slur-top">︵ Slur Top [L]</option>
                    <option value="slur-bottom">︶ Slur Btm [Shift+L]</option>
                </select>
                
                <select class="dropdown-tool" onchange="handleToolSelect(this)">
                    <option value="" disabled selected>📝 Text</option>
                    <option value="rit.">rit. [R]</option>
                    <option value="accel.">accel. [A]</option>
                    <option value="a tempo">a tempo [T]</option>
                </select>

                <div style="display: flex; gap: 4px; width: 100%;">
                    <input type="text" id="customText" placeholder="Custom text...">
                    <button onclick="addCustomText()">Add</button>
                </div>
            </div>

            <div id="edit-controls">
                <span style="font-size: 14px; font-weight: bold; width: 100%; text-align: center; color: #1e3a8a;">Selected Item</span>
                
                <div style="display: flex; gap: 4px; justify-content: center; width: 100%;">
                    <button class="nudge-btn" onclick="moveSelected(0, -1)">▲</button>
                    <button class="nudge-btn" onclick="moveSelected(0, 1)">▼</button>
                    <button class="nudge-btn" onclick="moveSelected(-1, 0)">◀</button>
                    <button class="nudge-btn" onclick="moveSelected(1, 0)">▶</button>
                </div>
                
                <div style="display: flex; gap: 4px; justify-content: center; width: 100%; margin-top: 4px;">
                    <button id="fastModeBtn" class="fast-btn" style="flex: 1;" onclick="toggleFastMode()">🐢 Fine Move</button>
                </div>

                <div class="edit-divider" style="width: 100%; height: 2px; margin: 6px 0;"></div>

                <div class="edit-text-only" style="display: flex; gap: 6px; justify-content: center; width: 100%;">
                    <button class="symbol-btn" onclick="resizeItem('size', -4)">A -</button>
                    <button class="symbol-btn" onclick="resizeItem('size', 4)">A +</button>
                </div>

                <div class="edit-shape-only" style="display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; width: 100%;">
                    <button class="shape-btn" onclick="resizeItem('width', -15)">↔ Less</button>
                    <button class="shape-btn" onclick="resizeItem('width', 15)">↔ More</button>
                    <button class="shape-btn" onclick="resizeItem('height', -5)">↕ Thinner</button>
                    <button class="shape-btn" onclick="resizeItem('height', 5)">↕ Thicker</button>
                </div>
            </div>
        </div>

        <div id="workspace-container">
            <div id="workspace">
                <canvas id="pdf-canvas"></canvas>
                <div id="overlay"></div>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let originalPdfBytes = null;
        let currentPageNum = 1;
        const scale = 1.5; 
        let annotations = []; 
        let selectedId = null;
        let isTouchMode = false;
        let isFastMode = false;
        let undoStack = [];
        let redoStack = [];
        let clipboardItem = null;

        const workspaceContainer = document.getElementById('workspace-container');
        const workspace = document.getElementById('workspace');
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const editControls = document.getElementById('edit-controls');
        const touchBtn = document.getElementById('touchToggleBtn');
        const fastBtn = document.getElementById('fastModeBtn');

        // --- IndexedDB for True Auto-Save ---
        const dbName = "SheetMusicApp";
        const storeName = "pdfStore";

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onupgradeneeded = (e) => { e.target.result.createObjectStore(storeName); };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async function savePDFToDB(arrayBuffer) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, "readwrite");
                const req = tx.objectStore(storeName).put(arrayBuffer, "currentPDF");
                req.onsuccess = () => resolve(); req.onerror = () => reject();
            });
        }

        async function loadPDFFromDB() {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(storeName, "readonly");
                const req = tx.objectStore(storeName).get("currentPDF");
                req.onsuccess = () => resolve(req.result); req.onerror = () => reject();
            });
        }

        function pushState() {
            undoStack.push(JSON.stringify(annotations));
            if (undoStack.length > 50) undoStack.shift(); 
            redoStack = []; 
        }

        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.stringify(annotations));
            annotations = JSON.parse(undoStack.pop());
            saveState(); rebuildOverlay(); updateEditControls();
        }

        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.stringify(annotations));
            annotations = JSON.parse(redoStack.pop());
            saveState(); rebuildOverlay(); updateEditControls();
        }

        function saveState() { localStorage.setItem('music_annotations', JSON.stringify(annotations)); }

        async function loadState() {
            const status = document.getElementById('statusMessage');
            try {
                const savedPDF = await loadPDFFromDB();
                if (savedPDF) {
                    originalPdfBytes = savedPDF;
                    pdfDoc = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
                    document.getElementById('pagination').style.display = 'flex';
                    document.getElementById('toolbar').style.display = 'flex';
                    renderPage(currentPageNum);
                    status.style.display = 'block';
                    status.innerText = `PDF Restored!`;
                }
            } catch (e) { console.log("No saved PDF found."); }

            const savedMarks = localStorage.getItem('music_annotations');
            if (savedMarks) {
                annotations = JSON.parse(savedMarks);
                if(annotations.length > 0) {
                    status.style.display = 'block';
                    status.innerText = `Session Restored: ${annotations.length} markings.`;
                    setTimeout(() => status.style.display = 'none', 5000);
                }
            }
        }
        window.onload = loadState;

        function discardAll() {
            if (annotations.length === 0) return alert("No markings to clear!");
            if (confirm("⚠️ Delete ALL markings from this PDF?")) {
                pushState();
                annotations = []; saveState(); selectedId = null; rebuildOverlay(); updateEditControls();
            }
        }

        async function clearEntireSession() {
            if (confirm("🧨 COMPLETE RESET\n\nAre you sure you want to completely wipe the app? This will delete your saved PDF file and ALL of your markings. This cannot be undone.")) {
                
                // 1. Wipe text markings
                localStorage.removeItem('music_annotations');
                
                // 2. Wipe saved PDF from database
                try {
                    const db = await openDB();
                    const tx = db.transaction(storeName, "readwrite");
                    tx.objectStore(storeName).clear();
                } catch (e) {
                    console.error("Failed to clear DB", e);
                }

                // 3. Reset all variables
                pdfDoc = null;
                originalPdfBytes = null;
                annotations = [];
                selectedId = null;
                undoStack = [];
                redoStack = [];

                // 4. Reset UI
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                workspace.style.width = '100%';
                workspace.style.height = '100%';
                overlay.innerHTML = '';
                document.getElementById('pagination').style.display = 'none';
                document.getElementById('toolbar').style.display = 'none';
                document.getElementById('upload').value = ''; // Reset file input
                editControls.classList.remove('active');

                // 5. Show success message
                const status = document.getElementById('statusMessage');
                status.style.display = 'block';
                status.style.color = '#ef4444';
                status.innerText = "Session completely reset.";
                setTimeout(() => { 
                    status.style.display = 'none'; 
                    status.style.color = '#10b981'; // reset to green
                }, 4000);
            }
        }

        function toggleTouchMode() {
            isTouchMode = !isTouchMode;
            if (isTouchMode) {
                touchBtn.classList.add('active'); touchBtn.innerText = "👆 Touch Mode: ON";
                workspaceContainer.classList.add('touch-locked');
            } else {
                touchBtn.classList.remove('active'); touchBtn.innerText = "👆 Touch Mode: OFF";
                workspaceContainer.classList.remove('touch-locked');
            }
        }

        function toggleFastMode() {
            isFastMode = !isFastMode;
            if (isFastMode) { fastBtn.classList.add('active'); fastBtn.innerText = "🚀 Fast Move"; } 
            else { fastBtn.classList.remove('active'); fastBtn.innerText = "🐢 Fine Move"; }
        }

        document.getElementById('upload').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalPdfBytes = await file.arrayBuffer();
            await savePDFToDB(originalPdfBytes); // Save to database
            
            pdfDoc = await pdfjsLib.getDocument({ data: originalPdfBytes }).promise;
            
            document.getElementById('pagination').style.display = 'flex';
            document.getElementById('toolbar').style.display = 'flex';
            document.getElementById('statusMessage').style.display = 'none'; 
            
            currentPageNum = 1; renderPage(currentPageNum);
        });

        async function renderPage(pageNum) {
            if (!pdfDoc) return;
            const page = await pdfDoc.getPage(pageNum);
            
            const viewport = page.getViewport({ scale: scale });
            canvas.width = viewport.width; canvas.height = viewport.height;
            workspace.style.width = viewport.width + 'px';
            workspace.style.height = viewport.height + 'px';

            await page.render({ canvasContext: ctx, viewport: viewport }).promise;
            document.getElementById('page-info').innerText = `${pageNum} / ${pdfDoc.numPages}`;
            rebuildOverlay();
        }

        function changePage(offset) {
            if (!pdfDoc) return;
            let newPage = currentPageNum + offset;
            if (newPage >= 1 && newPage <= pdfDoc.numPages) {
                currentPageNum = newPage; selectedId = null;
                updateEditControls(); renderPage(currentPageNum);
                workspaceContainer.scrollTo(0, 0); 
            }
        }

        function handleToolSelect(selectElement) {
            const val = selectElement.value;
            if (!val) return;
            if (['cresc', 'dim', 'bracket', 'slur-top', 'slur-bottom'].includes(val)) { addItem(val, ''); } 
            else { addItem('text', val); }
            selectElement.selectedIndex = 0; 
        }

        function addCustomText() {
            const text = document.getElementById('customText').value;
            if (text.trim() !== '') { addItem('text', text); document.getElementById('customText').value = ''; }
        }

        function addItem(type, text) {
            if (!pdfDoc) return alert("Open a PDF first!");
            pushState(); 
            
            const rect = workspace.getBoundingClientRect();
            const spawnY = Math.max(100, -rect.top + 200); 

            const newItem = {
                id: Date.now().toString(), 
                pageNum: currentPageNum, 
                type: type,
                text: text, 
                x: canvas.width / 2, 
                y: spawnY, 
                size: Math.round(26 * (scale/1.5)), 
                width: Math.round(100 * (scale/1.5)),
                height: Math.round(20 * (scale/1.5))
            };
            annotations.push(newItem); saveState(); selectItem(newItem.id); rebuildOverlay();
            if (window.innerWidth < 700 && !isTouchMode) toggleTouchMode();
        }

        function rebuildOverlay() {
            overlay.innerHTML = '';
            const pageItems = annotations.filter(a => a.pageNum === currentPageNum);
            
            pageItems.forEach(item => {
                const el = document.createElement('div');
                el.className = 'draggable-item';
                if (item.id === selectedId) el.classList.add('selected');
                el.style.left = `${item.x}px`; el.style.top = `${item.y}px`;
                
                if (item.type === 'text') {
                    el.classList.add('type-text'); el.innerText = item.text; el.style.fontSize = `${item.size}px`;
                } else {
                    el.classList.add('type-shape'); 
                    el.style.width = `${item.width}px`;
                    el.style.height = `${item.height}px`; 
                    
                    if (item.type === 'cresc') el.innerHTML = `<svg preserveAspectRatio="none"><line x1="0" y1="50%" x2="100%" y2="0%" /><line x1="0" y1="50%" x2="100%" y2="100%" /></svg>`;
                    else if (item.type === 'dim') el.innerHTML = `<svg preserveAspectRatio="none"><line x1="0" y1="0%" x2="100%" y2="50%" /><line x1="0" y1="100%" x2="100%" y2="50%" /></svg>`;
                    else if (item.type === 'bracket') el.innerHTML = `<svg preserveAspectRatio="none"><polyline points="0,100% 0,0 100%,0 100%,100%" /></svg>`;
                    else if (item.type === 'slur-top') el.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M 0 100 C 20 -20, 80 -20, 100 100" vector-effect="non-scaling-stroke"/></svg>`;
                    else if (item.type === 'slur-bottom') el.innerHTML = `<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M 0 0 C 20 120, 80 120, 100 0" vector-effect="non-scaling-stroke"/></svg>`;
                }

                let isDragging = false; let startOffsetX, startOffsetY; let hasMoved = false;

                const startDrag = (e) => {
                    e.preventDefault(); isDragging = true; hasMoved = false; selectItem(item.id);
                    const rect = workspace.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    startOffsetX = clientX - rect.left - item.x; startOffsetY = clientY - rect.top - item.y;
                };

                const doDrag = (e) => {
                    if (!isDragging) return;
                    if (!hasMoved) { pushState(); hasMoved = true; } 
                    e.preventDefault(); 
                    const rect = workspace.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    item.x = clientX - rect.left - startOffsetX; item.y = clientY - rect.top - startOffsetY;
                    el.style.left = `${item.x}px`; el.style.top = `${item.y}px`;
                };

                const endDrag = () => { if (isDragging) { isDragging = false; if(hasMoved) saveState(); } };

                el.addEventListener('mousedown', startDrag); document.addEventListener('mousemove', doDrag); document.addEventListener('mouseup', endDrag);
                el.addEventListener('touchstart', startDrag, {passive: false}); document.addEventListener('touchmove', doDrag, {passive: false}); document.addEventListener('touchend', endDrag);

                overlay.appendChild(el);
            });
        }

        function selectItem(id) { selectedId = id; rebuildOverlay(); updateEditControls(); }

        function updateEditControls() {
            if (!selectedId) { editControls.classList.remove('active'); return; }
            editControls.classList.add('active');
            const item = annotations.find(a => a.id === selectedId);
            const textBtns = document.querySelectorAll('.edit-text-only');
            const shapeBtns = document.querySelectorAll('.edit-shape-only');
            if (item.type === 'text') { 
                textBtns.forEach(b => b.style.display = 'flex'); shapeBtns.forEach(b => b.style.display = 'none'); 
            } else { 
                textBtns.forEach(b => b.style.display = 'none'); shapeBtns.forEach(b => b.style.display = 'flex'); 
            }
        }

        function moveSelected(dx, dy, isKeyboardShift = false) {
            if (!selectedId) return;
            pushState();
            const item = annotations.find(a => a.id === selectedId);
            if (item) { 
                const speedMultiplier = (isFastMode || isKeyboardShift) ? 15 : 1;
                item.x += (dx * speedMultiplier); item.y += (dy * speedMultiplier); 
                saveState(); rebuildOverlay(); 
            }
        }

        function resizeItem(property, amount) {
            if (!selectedId) return;
            pushState();
            const item = annotations.find(a => a.id === selectedId);
            if (item) { 
                const minVal = property === 'height' ? 5 : 12; 
                item[property] = Math.max(minVal, item[property] + amount); 
                saveState(); rebuildOverlay(); 
            }
        }

        document.addEventListener('keydown', (e) => {
            const activeTag = document.activeElement.tagName;
            if (activeTag === 'INPUT' || activeTag === 'SELECT') return;

            const isCtrl = e.ctrlKey || e.metaKey; 

            if (isCtrl && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
            if (isCtrl && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
            if (isCtrl && e.key.toLowerCase() === 'c') {
                if (selectedId) {
                    const itemToCopy = annotations.find(a => a.id === selectedId);
                    if (itemToCopy) { clipboardItem = JSON.parse(JSON.stringify(itemToCopy)); }
                } return;
            }
            if (isCtrl && e.key.toLowerCase() === 'v') {
                if (clipboardItem) {
                    e.preventDefault(); pushState();
                    const newItem = { ...clipboardItem, id: Date.now().toString(), pageNum: currentPageNum, x: clipboardItem.x + 20, y: clipboardItem.y + 20 };
                    annotations.push(newItem); saveState(); selectItem(newItem.id); rebuildOverlay();
                } return;
            }

            if (!isCtrl && !e.altKey && pdfDoc) {
                const keyStr = e.key.toLowerCase();
                const keyMap = {
                    'p': { type: 'text', val: e.shiftKey ? 'pp' : 'p' },
                    'f': { type: 'text', val: e.shiftKey ? 'ff' : 'f' },
                    'm': { type: 'text', val: e.shiftKey ? 'mf' : 'mp' },
                    '6': { type: 'text', val: '^' },
                    '8': { type: 'text', val: '.' },
                    '4': { type: 'text', val: '>' },
                    '2': { type: 'text', val: '-' },
                    's': { type: 'text', val: 'sfz' },
                    'r': { type: 'text', val: 'rit.' },
                    'a': { type: 'text', val: 'accel.' },
                    't': { type: 'text', val: 'a tempo' },
                    'c': { type: 'cresc', val: '' },
                    'd': { type: 'dim', val: '' },
                    'b': { type: 'bracket', val: '' },
                    'l': { type: e.shiftKey ? 'slur-bottom' : 'slur-top', val: '' }
                };
                
                if (keyMap[keyStr]) { 
                    e.preventDefault(); 
                    addItem(keyMap[keyStr].type, keyMap[keyStr].val); 
                    return; 
                }
            }

            if (selectedId) {
                let moved = false;
                if (e.key === 'ArrowUp') { moveSelected(0, -1, e.shiftKey); moved = true; }
                else if (e.key === 'ArrowDown') { moveSelected(0, 1, e.shiftKey); moved = true; }
                else if (e.key === 'ArrowLeft') { moveSelected(-1, 0, e.shiftKey); moved = true; }
                else if (e.key === 'ArrowRight') { moveSelected(1, 0, e.shiftKey); moved = true; }

                if (moved) { e.preventDefault(); } 
                else if (e.key === 'Backspace' || e.key === 'Delete') { pushState(); deleteSelected(); }
                else if (e.key === '+' || e.key === '=') {
                    e.preventDefault();
                    const item = annotations.find(a => a.id === selectedId);
                    if (item) {
                        if (item.type === 'text') resizeItem('size', 4);
                        else {
                            if (e.shiftKey) resizeItem('height', 5);
                            else resizeItem('width', 15);
                        }
                    }
                }
                else if (e.key === '-' || e.key === '_') {
                    e.preventDefault();
                    const item = annotations.find(a => a.id === selectedId);
                    if (item) {
                        if (item.type === 'text') resizeItem('size', -4);
                        else {
                            if (e.shiftKey) resizeItem('height', -5);
                            else resizeItem('width', -15);
                        }
                    }
                }
            }
        });

        function deleteSelected() {
            if (!selectedId) return;
            annotations = annotations.filter(a => a.id !== selectedId);
            selectedId = null; saveState(); updateEditControls(); rebuildOverlay();
        }

        async function exportPDF() {
            if (!originalPdfBytes) return alert("No PDF loaded!");
            
            const { PDFDocument, rgb, StandardFonts } = PDFLib;
            const pdfDocLib = await PDFDocument.load(originalPdfBytes);
            const boldItalicFont = await pdfDocLib.embedFont(StandardFonts.TimesRomanBoldItalic);
            const pages = pdfDocLib.getPages();

            for (const item of annotations) {
                const pageIndex = item.pageNum - 1;
                if (pageIndex >= pages.length) continue;
                const page = pages[pageIndex];
                
                const pdfjsPage = await pdfDoc.getPage(item.pageNum);
                const viewport = pdfjsPage.getViewport({ scale: scale });
                
                const pdfX = (item.x / viewport.width) * page.getWidth();
                const pdfY = page.getHeight() - ((item.y / viewport.height) * page.getHeight());

                if (item.type === 'text') {
                    const fontSize = item.size / scale;
                    const textWidth = boldItalicFont.widthOfTextAtSize(item.text, fontSize);
                    const textHeight = boldItalicFont.heightAtSize(fontSize);
                    
                    page.drawText(item.text, { x: pdfX - (textWidth / 2), y: pdfY - (textHeight / 3), size: fontSize, font: boldItalicFont, color: rgb(0,0,0) });
                } else {
                    const w = item.width / scale; const h = item.height / scale; 
                    const black = rgb(0,0,0); const thick = 1.5;
                    
                    if (item.type === 'cresc') {
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY}, end: {x: pdfX + w/2, y: pdfY + h/2}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY}, end: {x: pdfX + w/2, y: pdfY - h/2}, thickness: thick, color: black });
                    } else if (item.type === 'dim') {
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY + h/2}, end: {x: pdfX + w/2, y: pdfY}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY - h/2}, end: {x: pdfX + w/2, y: pdfY}, thickness: thick, color: black });
                    } else if (item.type === 'bracket') {
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY + h/2}, end: {x: pdfX + w/2, y: pdfY + h/2}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX - w/2, y: pdfY + h/2}, end: {x: pdfX - w/2, y: pdfY}, thickness: thick, color: black });
                        page.drawLine({ start: {x: pdfX + w/2, y: pdfY + h/2}, end: {x: pdfX + w/2, y: pdfY}, thickness: thick, color: black });
                    } else if (item.type === 'slur-top') {
                        page.drawBezierCurve({ start: { x: pdfX - w/2, y: pdfY - h/2 }, control1: { x: pdfX - w*0.3, y: pdfY + h/2 + h*0.2 }, control2: { x: pdfX + w*0.3, y: pdfY + h/2 + h*0.2 }, end: { x: pdfX + w/2, y: pdfY - h/2 }, thickness: thick, color: black });
                    } else if (item.type === 'slur-bottom') {
                        page.drawBezierCurve({ start: { x: pdfX - w/2, y: pdfY + h/2 }, control1: { x: pdfX - w*0.3, y: pdfY - h/2 - h*0.2 }, control2: { x: pdfX + w*0.3, y: pdfY - h/2 - h*0.2 }, end: { x: pdfX + w/2, y: pdfY + h/2 }, thickness: thick, color: black });
                    }
                }
            }

            const pdfBytes = await pdfDocLib.save();
            const blob = new Blob([pdfBytes], { type: "application/pdf" });
            const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = "Final_Annotated_Score.pdf"; link.click();
        }
    </script>
